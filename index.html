<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canal 5 MX</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body>

<video id="video" controls autoplay></video>

<script>
const video = document.getElementById('video');

const videoSrc = 'https://chsuz.vivolatamz.org/canal5mx/tracks-v1a1/mono.m3u8?ip=181.174.104.124&token=4e0d88d749423ea0abc08ed73dc0242f06a531f9-5f-1781247155-1781193155';

if (Hls.isSupported()) {
    const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true
    });

    hls.loadSource(videoSrc);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, function () {
        video.play().catch(() => {});
    });

} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = videoSrc;
    video.addEventListener('loadedmetadata', function () {
        video.play().catch(() => {});
    });
}
</script>

</body>
</html>
